<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYT Café Admin</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:28px auto;padding:18px}
.card{background:#1b1b1f;border:1px solid #36363b;border-radius:16px;padding:22px;margin-bottom:18px}
h1,h2,h3{margin-top:0}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button,.actions button,.item button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer}
.tab{background:#333;color:#fff}.tab.active{background:#ff8a3d;color:#111}.primary{background:#ff8a3d;color:#111}.danger{background:#b33245;color:#fff}.green{background:#2d8b4b;color:#fff}.dark{background:#333;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:block;margin-bottom:6px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;background:#101014;color:#fff;border:1px solid #444;border-radius:9px;padding:11px}textarea{min-height:90px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.msg{margin-top:12px;color:#aaa}.ok{color:#7ee787}.err{color:#ff7b7b}
.item{border:1px solid #3a3a40;background:#141417;border-radius:12px;padding:14px;margin:10px 0}.itemtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.meta{font-size:13px;color:#aaa;margin-top:5px}.item-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}
.result{cursor:pointer;transition:border-color .15s}.result:hover{border-color:#ff8a3d}.sub{color:#777;font-size:12px;margin-top:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.itemtop{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card">
<h1>☕ TYT Café Admin</h1><h3>تسجيل الدخول</h3>
<form id="loginForm"><label>الإيميل</label><input id="email" type="email" required>
<label>الباسورد</label><input id="password" type="password" required>
<div class="actions"><button class="primary">دخول</button></div><div id="loginMsg" class="msg"></div></form>
</div></div>

<div id="appView" class="wrap hidden">
<div class="card"><div class="itemtop"><div><h1>☕ TYT Café Admin</h1><div id="user" class="meta"></div></div><button id="logout" class="dark">خروج</button></div></div>
<div class="card">
<div class="tabs"><button id="menuTab" class="tab active">الأصناف</button><button id="offersTab" class="tab">العروض</button></div>

<section id="menuPanel">

<div class="card" id="categoryManager">
<div class="itemtop">
<h3 style="margin:0">إدارة الأقسام</h3>
<button type="button" id="cToggleAdd" class="dark">+ إضافة قسم</button>
</div>
<form id="categoryForm" class="hidden" style="margin-top:14px">
<div class="grid">
<div class="full"><label>اسم القسم الجديد</label><input id="cName" required></div>
<div class="full"><label>نوع القسم (لاختيار الأيقونة المناسبة تلقائيًا)</label><select id="cType"></select></div>
</div>
<div class="actions"><button class="primary">حفظ القسم</button><button type="button" id="cCancelAdd" class="dark">إلغاء</button></div>
<div id="cMsg" class="msg"></div>
</form>
<div id="categoryList" style="margin-top:12px"></div>
</div>

<div class="card">
<label>ابحث عن صنف</label>
<input id="mSearch" placeholder="اكتب اسم الصنف… مثال: لاتيه أو Espresso" autocomplete="off">
<div id="mResults"></div>
</div>

<div id="mEditorCard" class="card hidden">
<div class="itemtop">
<div><h3 id="mEditorName" style="margin:0"></h3><div id="mEditorMeta" class="meta"></div></div>
<button type="button" id="mClearSelection" class="dark">✕ إلغاء التحديد</button>
</div>
<div class="grid" style="margin-top:14px">
<div class="full"><label>اسم الصنف</label><input id="mEditName" required></div>
<div class="full"><label>الوصف / المكونات</label><textarea id="mEditDesc"></textarea></div>
<div><label>السعر</label><input id="mNewPrice" inputmode="decimal" required></div>
<div><label>القسم</label><select id="mCategorySelect"></select></div>
<div><label>الشارة (Badge)</label><select id="mBadgeSelect">
<option value="none">بدون شارة (None)</option>
<option value="new">جديد (New)</option>
<option value="best-seller">الأكثر مبيعًا (Best Seller)</option>
<option value="popular">الأكثر طلبًا (Popular)</option>
</select></div>
<div class="full"><label>رابط الصورة (اختياري)</label><input id="mEditImage"></div>
</div>
<div class="actions">
<button type="button" id="mSaveAll" class="primary">💾 حفظ كل التعديلات</button>
<button type="button" id="mDeleteItem" class="danger">🗑️ حذف الصنف</button>
</div>
<div id="mEditorMsg" class="msg"></div>
</div>

<div class="card">
<div class="itemtop">
<h3 style="margin:0">إضافة صنف جديد</h3>
<button type="button" id="mToggleAdd" class="dark">+ صنف جديد</button>
</div>
<form id="menuForm" class="hidden">
<input id="menuId" type="hidden"><input id="menuSourceKey" type="hidden">
<div class="grid" style="margin-top:14px">
<div><label>اسم الصنف</label><input id="mName" required></div><div><label>السعر</label><input id="mPrice" required></div>
<div><label>القسم</label><select id="mCategory" required></select></div><div><label>الوصف</label><input id="mDesc"></div>
<div><label>الشارة (Badge)</label><select id="mAddBadge">
<option value="none">بدون شارة (None)</option>
<option value="new">جديد (New)</option>
<option value="best-seller">الأكثر مبيعًا (Best Seller)</option>
<option value="popular">الأكثر طلبًا (Popular)</option>
</select></div>
<div class="full"><label>الصورة</label><input id="mImage"></div>
</div>
<div class="actions"><button class="primary">حفظ الصنف الجديد</button><button type="button" id="mCancelAdd" class="dark">إلغاء</button></div>
<div id="mMsg" class="msg"></div>
</form>
<div class="sub">تستخدم "صنف جديد" فقط للأصناف غير الموجودة أصلًا في المنيو. لتعديل صنف موجود، استخدم البحث بالأعلى.
<button type="button" id="mImport" class="dark" style="margin-top:8px">استيراد الأصناف الناقصة من المنيو الأصلية</button></div>
</div>

</section>

<section id="offersPanel" class="hidden">
<form id="offerForm"><input id="offerId" type="hidden"><div class="grid">
<div><label>اسم العرض</label><input id="oName" required></div><div><label>السعر الجديد</label><input id="oNewPrice" required></div>
<div><label>السعر القديم</label><input id="oOldPrice"></div><div><label>الخصم</label><input id="oDiscount"></div>
<div><label>الشارة</label><input id="oBadge"></div><div><label>نوع الشارة</label><select id="oBadgeType"><option value="special">special</option><option value="limited">limited</option></select></div>
<div class="full"><label>نوع العرض * (لاختيار الشكل/الأيقونة المناسبة تلقائيًا)</label><select id="oOfferType" required>
<option value="">اختر نوع العرض</option>
<option value="food">Food 🥐</option>
<option value="dessert">Sweet / Dessert 🍰</option>
<option value="hot-drink">Hot Drink ☕</option>
<option value="cold-drink">Cold Drink 🥤</option>
</select></div>
<div class="full"><label>الوصف</label><textarea id="oDescription"></textarea></div>
<div class="full"><label>رابط الصورة</label><input id="oImage"></div>
<div><label>الحالة</label><select id="oActive"><option value="true">🟢 شغال</option><option value="false">🔴 متوقف</option></select></div>
</div><div class="actions"><button class="primary">حفظ العرض</button><button type="button" id="oNew" class="dark">عرض جديد</button><button type="button" id="oDeleteAll" class="danger">حذف كل العروض</button></div><div id="oMsg" class="msg"></div></form>
<h3>العروض الموجودة</h3><div id="offerList"></div>
</section>
</div></div>

<script src="js/menu-data.js"></script><script src="js/offers-data.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA_iRaVTZwvi25XabH_PfC8cKK_BeYYRPY",authDomain:"tyt-cafe-8c2ae.firebaseapp.com",projectId:"tyt-cafe-8c2ae",storageBucket:"tyt-cafe-8c2ae.firebasestorage.app",messagingSenderId:"298823761893",appId:"1:298823761893:web:7652134d929a5466c9f90c"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const setMsg=(id,t,err=false)=>{$(id).textContent=t;$(id).className="msg "+(err?"err":"ok")};

$("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(x){setMsg("loginMsg","بيانات الدخول غير صحيحة",true)}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("user").textContent=u.email||"";initMenuAdmin();loadOffers()}else{$("loginView").classList.remove("hidden");$("appView").classList.add("hidden")}});

$("menuTab").onclick=()=>{$("menuPanel").classList.remove("hidden");$("offersPanel").classList.add("hidden");$("menuTab").classList.add("active");$("offersTab").classList.remove("active")};
$("offersTab").onclick=()=>{$("offersPanel").classList.remove("hidden");$("menuPanel").classList.add("hidden");$("offersTab").classList.add("active");$("menuTab").classList.remove("active");loadOffers()};

/* Offer Type → automatic icon/visual (admin only picks the type; no
   manual "choose an image" step needed unless they want a custom photo). */
const OFFER_TYPE_ICON={food:"🍽️",dessert:"🍰","hot-drink":"☕","cold-drink":"🥤"};
const OFFER_TYPE_LABELS={food:"Food",dessert:"Sweet / Dessert","hot-drink":"Hot Drink","cold-drink":"Cold Drink"};

function resetOffer(){$("offerForm").reset();$("offerId").value="";$("oActive").value="true"}
$("oNew").onclick=resetOffer;
$("offerForm").onsubmit=async e=>{e.preventDefault();const id=$("offerId").value;
 const offerType=$("oOfferType").value;
 if(!offerType){setMsg("oMsg","اختر نوع العرض",true);return}
 const data={name:$("oName").value.trim(),newPrice:$("oNewPrice").value.trim(),oldPrice:$("oOldPrice").value.trim(),discount:$("oDiscount").value.trim(),badge:$("oBadge").value.trim(),badgeType:$("oBadgeType").value,description:$("oDescription").value.trim(),image:$("oImage").value.trim(),active:$("oActive").value==="true",offerType,icon:OFFER_TYPE_ICON[offerType]||"☕"};
 try{if(id)await updateDoc(doc(db,"offers",id),data);else await addDoc(collection(db,"offers"),data);resetOffer();await loadOffers();setMsg("oMsg","تم حفظ العرض ✓")}catch(x){setMsg("oMsg",x.code||x.message,true)}};
async function loadOffers(){const box=$("offerList");box.innerHTML="جاري التحميل...";
 try{const s=await getDocs(collection(db,"offers"));box.innerHTML=s.empty?"<div class='msg'>مفيش عروض حاليًا في Firebase.</div>":"";
 s.forEach(d=>{const x=d.data(),active=x.active!==false,el=document.createElement("div");el.className="item";
 el.innerHTML=`<div class="itemtop"><div><b>${esc(x.name||"بدون اسم")}</b><div class="meta">السعر: ${esc(x.newPrice??"")} · القديم: ${esc(x.oldPrice??"")} · الخصم: ${esc(x.discount??"")} · ${esc(OFFER_TYPE_LABELS[x.offerType]||"بدون نوع")} · ${active?"🟢 شغال":"🔴 متوقف"}</div></div><div class="item-actions"><button class="dark edit">✏️ تعديل</button><button class="${active?"dark":"green"} toggle">${active?"🔴 إيقاف":"🟢 تشغيل"}</button><button class="danger del">🗑️ حذف</button></div></div><div class="meta">${esc(x.description||"")}</div>`;
 el.querySelector(".edit").onclick=()=>{ $("offerId").value=d.id;$("oName").value=x.name||"";$("oNewPrice").value=x.newPrice??"";$("oOldPrice").value=x.oldPrice??"";$("oDiscount").value=x.discount??"";$("oBadge").value=x.badge||"";$("oBadgeType").value=x.badgeType||"special";$("oOfferType").value=x.offerType||"";$("oDescription").value=x.description||"";$("oImage").value=x.image||"";$("oActive").value=String(active);window.scrollTo({top:0,behavior:"smooth"})};
 el.querySelector(".toggle").onclick=async()=>{await updateDoc(doc(db,"offers",d.id),{active:!active});loadOffers()};
 el.querySelector(".del").onclick=async()=>{
   if(!confirm("حذف العرض ده فقط؟"))return;
   try{
     await deleteDoc(doc(db,"offers",d.id));
     await loadOffers();
     setMsg("oMsg","تم حذف العرض ✓");
   }catch(x){setMsg("oMsg",x.code||x.message,true)}
 };
 box.appendChild(el)})}catch(x){box.innerHTML=`<div class='err'>${esc(x.code||x.message)}</div>`}}

/* CATEGORY MANAGEMENT: additive only */
let CATEGORY_CACHE=[];
let CATEGORY_DOCS=new Map();

/* Category Type → automatic icon (mirrors js/main.js's icon set exactly,
   so the icon the admin sees described here is the icon shown on the
   live site). Picking a type is all that's needed — no manual icon
   picking required. */
const CATEGORY_TYPES=[["food","Food 🥐"],["dessert","Sweet / Dessert 🍰"],["hot-drink","Hot Drinks ☕"],["cold-drink","Cold Drinks 🥤"],["other","Other"]];
function categoryTypeOptionsHtml(selected){return CATEGORY_TYPES.map(([v,l])=>`<option value="${v}" ${v===selected?"selected":""}>${l}</option>`).join("")}
function categoryTypeLabel(key){const f=CATEGORY_TYPES.find(([v])=>v===key);return f?f[1]:"أيقونة مخصصة"}
$("cType").innerHTML=categoryTypeOptionsHtml("other");

function baseCategories(){
 const src=typeof MENU_DATA!=="undefined"?MENU_DATA:[];
 return src.map(c=>({id:c.id,name:c.name,icon:c.icon||"extra",description:c.description||"",deleted:false,__base:true}));
}
async function loadCategories(){
 const map=new Map(baseCategories().map(c=>[c.id,c]));
 CATEGORY_DOCS=new Map();
 try{
  const s=await getDocs(collection(db,"menuCategories"));
  s.forEach(d=>{
   const x=d.data();
   CATEGORY_DOCS.set(d.id,{id:d.id,...x});
   const current=map.get(d.id);
   if(current) map.set(d.id,{...current,...x,id:d.id});
   else if(x.deleted!==true) map.set(d.id,{id:d.id,name:x.name||"قسم جديد",icon:x.icon||"extra",description:x.description||"",...x,__base:false});
  });
 }catch(e){console.info("category data unavailable; using bundled categories.",e)}
 CATEGORY_CACHE=[...map.values()].filter(c=>c.deleted!==true);
 return CATEGORY_CACHE;
}
function categoryOptionsHtml(selected=""){
 return CATEGORY_CACHE.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?"selected":""}>${esc(c.name)}</option>`).join("");
}
function refreshCategoryControls(selectedEditor=""){
 const select=$("mCategorySelect");
 if(select) select.innerHTML=categoryOptionsHtml(selectedEditor);
 const add=$("mCategory");
 if(add) add.innerHTML='<option value="">اختر القسم</option>'+categoryOptionsHtml("");
}
function renderCategoryList(){
 const box=$("categoryList");if(!box)return;
 box.innerHTML="";
 CATEGORY_CACHE.forEach(c=>{
  const el=document.createElement("div");el.className="item";
  const currentType=CATEGORY_TYPES.some(([v])=>v===c.type)?c.type:(CATEGORY_TYPES.some(([v])=>v===c.icon)?c.icon:"");
  el.innerHTML=`<div class="itemtop"><div><b>${esc(c.name)}</b><div class="meta">${c.__base?"من المنيو الأصلية":"مضاف من الإدارة"} · ${esc(categoryTypeLabel(currentType))} · ID: ${esc(c.id)}</div></div><div class="item-actions"><button class="dark rename">✏️ تعديل</button><button class="danger delcat">🗑️ حذف</button></div></div>
  <div class="cat-edit hidden" style="margin-top:12px">
   <div class="grid">
    <div class="full"><label>اسم القسم</label><input class="catNameInput" value="${esc(c.name)}"></div>
    <div class="full"><label>نوع القسم</label><select class="catTypeSelect">${categoryTypeOptionsHtml(currentType)}</select></div>
   </div>
   <div class="actions"><button type="button" class="primary catSave">حفظ التعديلات</button><button type="button" class="dark catCancel">إلغاء</button></div>
   <div class="catMsg msg"></div>
  </div>`;
  const editBox=el.querySelector(".cat-edit");
  el.querySelector(".rename").onclick=()=>{editBox.classList.toggle("hidden");if(!editBox.classList.contains("hidden"))el.querySelector(".catNameInput").focus()};
  el.querySelector(".catCancel").onclick=()=>editBox.classList.add("hidden");
  el.querySelector(".catSave").onclick=async()=>{
   const nameInput=el.querySelector(".catNameInput"),typeSelect=el.querySelector(".catTypeSelect"),msgEl=el.querySelector(".catMsg");
   const name=nameInput.value.trim(),type=typeSelect.value;
   const setCatMsg=(t,err)=>{msgEl.textContent=t;msgEl.className="catMsg msg "+(err?"err":"ok")};
   if(!name){setCatMsg("اكتب اسم القسم",true);return}
   if(CATEGORY_CACHE.some(x=>x.id!==c.id&&x.name.trim().toLowerCase()===name.toLowerCase())){setCatMsg("يوجد قسم آخر بنفس الاسم بالفعل",true);return}
   try{
    /* Same document id (c.id) — this UPDATES the existing category, it
       never creates a new one, and every item's categoryId still points
       here, so all its items stay inside it after the rename. */
    await setDoc(doc(db,"menuCategories",c.id),{name,type,icon:type,description:c.description||"",deleted:false});
    await loadCategories();renderCategoryList();refreshCategoryControls(c.id);await initMenuAdmin();
    setMsg("cMsg","تم حفظ تعديلات القسم ✓");
   }catch(e){setCatMsg(e.code||e.message,true)}
  };
  el.querySelector(".delcat").onclick=()=>deleteCategory(c);
  box.appendChild(el);
 });
}
async function deleteCategory(cat){
 const others=CATEGORY_CACHE.filter(c=>c.id!==cat.id);
 if(!others.length){setMsg("cMsg","لا يمكن حذف آخر قسم.",true);return}
 const choices=others.map(c=>`${c.id} = ${c.name}`).join("\n");
 const target=prompt(`القسم "${cat.name}".\nإذا كان بداخله أصناف، اكتب ID القسم الذي تريد نقلها إليه.\nأو اكتب DELETE لحذف القسم فقط وترك الأصناف بدون قسم.\n\n${choices}`,"");
 if(target===null)return;
 const value=target.trim();
 if(!value)return;
 try{
  const docs=await getDocs(collection(db,"menu")),affected=[];
  docs.forEach(d=>{const x=d.data();if(x.deleted===true)return;
   const same=String(x.categoryId||"")===cat.id || (!x.categoryId&&String(x.category||"").trim().toLowerCase()===cat.name.trim().toLowerCase());
   if(same)affected.push({id:d.id,x});
  });
  if(value.toUpperCase()==="DELETE"){
   if(affected.length&&!confirm(`يوجد ${affected.length} صنف داخل القسم. هل تريد حذف القسم فقط وترك الأصناف؟`))return;
  }else{
   const dest=others.find(c=>c.id===value);
   if(!dest){setMsg("cMsg","ID القسم غير صحيح.",true);return}
   for(const r of affected) await updateDoc(doc(db,"menu",r.id),{categoryId:dest.id,category:dest.name});
  }
  await setDoc(doc(db,"menuCategories",cat.id),{name:cat.name,type:cat.type||"",icon:cat.icon||"extra",description:cat.description||"",deleted:true});
  await loadCategories();renderCategoryList();refreshCategoryControls();await initMenuAdmin();setMsg("cMsg","تم حذف القسم ✓");
 }catch(e){setMsg("cMsg",e.code||e.message,true)}
}
$("cToggleAdd").onclick=()=>{$("categoryForm").classList.toggle("hidden");if(!$("categoryForm").classList.contains("hidden"))$("cName").focus()};
$("cCancelAdd").onclick=()=>{$("categoryForm").classList.add("hidden");$("categoryForm").reset()};
$("categoryForm").onsubmit=async e=>{
 e.preventDefault();const name=$("cName").value.trim(),type=$("cType").value||"other";
 if(!name){setMsg("cMsg","اكتب اسم القسم",true);return}
 if(CATEGORY_CACHE.some(c=>c.name.toLowerCase()===name.toLowerCase())){setMsg("cMsg","القسم موجود بالفعل",true);return}
 try{
  const ref=await addDoc(collection(db,"menuCategories"),{name,type,icon:type,description:"",deleted:false,order:CATEGORY_CACHE.length});
  await loadCategories();renderCategoryList();refreshCategoryControls(ref.id);$("categoryForm").reset();$("cType").value="other";$("categoryForm").classList.add("hidden");setMsg("cMsg","تم إضافة القسم ✓");
 }catch(e){setMsg("cMsg",e.code||e.message,true)}
};

const menuKeyPart=v=>String(v??"").trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const canonicalMenuKey=(categoryId,name)=>`menu:${categoryId}:${menuKeyPart(name)}`;
function getBaseMenuIndex(){
 const byKey=new Map(),legacy=new Map(),positional=new Map();
 if(typeof MENU_DATA==="undefined")return {byKey,legacy,positional};
 MENU_DATA.forEach(c=>(c.items||[]).forEach((it,i)=>{
  const key=canonicalMenuKey(c.id,it.name);
  const item={...it,category:c.name,categoryId:c.id,sourceKey:key,originalName:it.name,__base:true};
  byKey.set(key,item);
  legacy.set(`${String(c.id).trim().toLowerCase()}||${String(it.name).trim().toLowerCase()}`,key);
  legacy.set(`${String(c.name).trim().toLowerCase()}||${String(it.name).trim().toLowerCase()}`,key);
  positional.set(`menu:${c.id}:${i}`,key);
 }));
 return {byKey,legacy,positional};
}
function resolveMenuDoc(x,index){
 const rawKey=String(x.sourceKey||"");
 let key=index.byKey.has(rawKey)?rawKey:(index.positional.get(rawKey)||"");
 const originalName=String(x.originalName||x.baseName||"").trim();
 if(!key&&originalName)key=index.legacy.get(`${String(x.categoryId||"").trim().toLowerCase()}||${originalName.toLowerCase()}`)||index.legacy.get(`${String(x.category||"").trim().toLowerCase()}||${originalName.toLowerCase()}`)||"";
 if(!key)key=index.legacy.get(`${String(x.categoryId||"").trim().toLowerCase()}||${String(x.name||"").trim().toLowerCase()}`)||index.legacy.get(`${String(x.category||"").trim().toLowerCase()}||${String(x.name||"").trim().toLowerCase()}`)||"";
 return key;
}
async function populateCategoryList(){
 await loadCategories();refreshCategoryControls();renderCategoryList();
}
populateCategoryList();

/* ---------------------------------------------------------------------
   MENU ADMIN — search/select/edit-price workflow.
   The full merged menu (base + Firebase overrides + extras) is built
   once into an in-memory cache for searching; it is never rendered as
   a big list. Each save/delete still writes exactly one Firestore
   document, so the existing per-item architecture is unchanged.
--------------------------------------------------------------------- */
let MENU_INDEX_CACHE=[];
let SELECTED_ITEM=null;

async function buildMenuIndex(){
 const s=await getDocs(collection(db,"menu")),index=getBaseMenuIndex(),overrides=new Map(),tombstones=new Set(),extras=[];
 s.forEach(d=>{const x=d.data(),key=resolveMenuDoc(x,index);if(x.deleted===true){if(key)tombstones.add(key);return}if(key&&index.byKey.has(key))overrides.set(key,{d,x});else extras.push({d,x})});
 const rows=[];
 index.byKey.forEach((base,key)=>{
  if(tombstones.has(key))return;
  const hit=overrides.get(key);
  rows.push({
   docId:hit?.d?.id||null,
   name:(hit?hit.x.name:base.name)||base.name,
   category:(hit?hit.x.category:base.category)||base.category,
   categoryId:(hit?hit.x.categoryId:base.categoryId)||base.categoryId,
   price:hit?hit.x.price:base.price,
   description:(hit?hit.x.description:base.description)||"",
   image:(hit?hit.x.image:base.image)||"",
   badge:(hit?hit.x.badge:base.badge)||"none",
   sourceKey:key,
   docData:hit?.x||null,
   isBase:true,
   baseData:base
  });
 });
 extras.forEach(r=>rows.push({
  docId:r.d.id,name:r.x.name,category:r.x.category,categoryId:r.x.categoryId||CATEGORY_CACHE.find(c=>c.name===r.x.category)?.id||"",
  price:r.x.price,description:r.x.description||"",image:r.x.image||"",badge:r.x.badge||"none",
  sourceKey:r.x.sourceKey||"",docData:r.x,isBase:false,baseData:null
 }));
 return rows;
}

async function initMenuAdmin(){
 try{if(!CATEGORY_CACHE.length)await loadCategories();refreshCategoryControls();MENU_INDEX_CACHE=await buildMenuIndex()}catch(x){console.error("menu index",x)}
}

function renderResults(query){
 const box=$("mResults");
 const q=query.trim().toLowerCase();
 if(!q){box.innerHTML="";return}
 const matches=MENU_INDEX_CACHE.filter(it=>String(it.name||"").toLowerCase().includes(q)).slice(0,12);
 if(!matches.length){box.innerHTML="<div class='msg'>لا يوجد صنف بهذا الاسم.</div>";return}
 box.innerHTML="";
 matches.forEach(it=>{
  const el=document.createElement("div");el.className="item result";
  el.innerHTML=`<div class="itemtop"><div><b>${esc(it.name)}</b><div class="meta">${esc(it.category)} · ${esc(it.price)} EGP</div></div></div>`;
  el.onclick=()=>selectItem(it);
  box.appendChild(el);
 });
}

function selectItem(it){
 SELECTED_ITEM=it;
 $("mEditorName").textContent=it.name;
 $("mEditorMeta").textContent=`${it.category}${it.isBase?" · من المنيو الأصلية":" · مضاف من الإدارة"}`;
 $("mEditName").value=it.name||"";
 $("mEditDesc").value=it.description||"";
 $("mNewPrice").value=it.price??"";
 $("mEditImage").value=it.image||"";
 $("mBadgeSelect").value=it.badge||"none";
 refreshCategoryControls(it.categoryId||it.baseData?.categoryId||CATEGORY_CACHE.find(c=>c.name===it.category)?.id||"");
 $("mEditorMsg").textContent="";$("mEditorMsg").className="msg";
 $("mEditorCard").classList.remove("hidden");
 $("mResults").innerHTML="";
 window.scrollTo({top:0,behavior:"smooth"});
}

function clearSelection(){
 SELECTED_ITEM=null;
 $("mEditorCard").classList.add("hidden");
 $("mEditName").value="";
 $("mEditDesc").value="";
 $("mNewPrice").value="";
 $("mEditImage").value="";
 $("mBadgeSelect").value="none";
}

$("mSearch").addEventListener("input",e=>renderResults(e.target.value));
$("mClearSelection").onclick=clearSelection;

/* Single "save all" action: edits the item's name, description, price,
   category and badge together and writes ONE update to the existing
   Firestore document (or creates the admin's override doc the first
   time a bundled item is touched) — it never creates a duplicate item.
   `sourceKey`/`originalName` are preserved untouched so the item keeps
   its stable identity even after its display name changes. */
$("mSaveAll").onclick=async()=>{
 if(!SELECTED_ITEM)return;
 const it=SELECTED_ITEM;
 const name=$("mEditName").value.trim();
 const price=$("mNewPrice").value.trim();
 if(!name){setMsg("mEditorMsg","اكتب اسم الصنف",true);return}
 if(!price){setMsg("mEditorMsg","اكتب السعر",true);return}
 const description=$("mEditDesc").value.trim();
 const image=$("mEditImage").value.trim();
 const badge=$("mBadgeSelect").value||"none";
 const selectedCategoryId=$("mCategorySelect").value||it.categoryId||"";
 const selectedCategory=CATEGORY_CACHE.find(c=>c.id===selectedCategoryId);
 const payload={
  name,category:selectedCategory?.name||it.category,categoryId:selectedCategoryId,
  price,description,image,badge,
  sourceKey:it.sourceKey,deleted:false,
  ...(it.isBase?{originalName:it.baseData.originalName}:{})
 };
 try{
  if(it.docId)await updateDoc(doc(db,"menu",it.docId),payload);
  else{const ref=await addDoc(collection(db,"menu"),payload);it.docId=ref.id}
  Object.assign(it,{name,category:payload.category,categoryId:selectedCategoryId,price,description,image,badge});
  $("mEditorName").textContent=name;
  $("mEditorMeta").textContent=`${payload.category}${it.isBase?" · من المنيو الأصلية":" · مضاف من الإدارة"}`;
  setMsg("mEditorMsg","✓ تم حفظ كل التعديلات بنجاح");
  MENU_INDEX_CACHE=await buildMenuIndex();
 }catch(x){setMsg("mEditorMsg",x.code||x.message,true)}
};

$("mDeleteItem").onclick=async()=>{
 if(!SELECTED_ITEM)return;
 if(!confirm("حذف الصنف ده فقط؟"))return;
 const it=SELECTED_ITEM;
 try{
  if(it.isBase){
   const payload={deleted:true,sourceKey:it.sourceKey,originalName:it.baseData.originalName,categoryId:it.baseData.categoryId,category:it.baseData.category};
   if(it.docId)await updateDoc(doc(db,"menu",it.docId),payload);
   else await addDoc(collection(db,"menu"),payload);
  }else if(it.docId){
   await deleteDoc(doc(db,"menu",it.docId));
  }
  setMsg("mMsg","تم حذف الصنف ✓");
  clearSelection();
  $("mSearch").value="";$("mResults").innerHTML="";
  buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);
 }catch(x){setMsg("mEditorMsg",x.code||x.message,true)}
};

/* ---------------------------------------------------------------------
   ADD NEW ITEM — separate workflow, only for items that don't already
   exist in the base menu.
--------------------------------------------------------------------- */
function resetMenuForm(){
 $("menuForm").reset();$("menuId").value="";$("menuSourceKey").value="";
}
$("mToggleAdd").onclick=()=>{
 const willShow=$("menuForm").classList.contains("hidden");
 $("menuForm").classList.toggle("hidden");
 if(willShow){resetMenuForm();$("mName").focus()}
};
$("mCancelAdd").onclick=()=>{$("menuForm").classList.add("hidden");resetMenuForm()};

$("menuForm").onsubmit=async e=>{
 e.preventDefault();
 const id=$("menuId").value,stableKey=$("menuSourceKey").value.trim();
 const categoryId=$("mCategory").value;
 const selectedCategory=CATEGORY_CACHE.find(c=>c.id===categoryId);
 if(!selectedCategory){setMsg("mMsg","اختر قسمًا موجودًا من القائمة",true);return}
 /* Always resolve the category by its stable ID (never by name) and save
    BOTH category (display name) and categoryId — this is what puts a new
    item inside the exact existing category selected, and never creates
    a new one. */
 const data={name:$("mName").value.trim(),price:$("mPrice").value.trim(),category:selectedCategory.name,categoryId:selectedCategory.id,description:$("mDesc").value.trim(),image:$("mImage").value.trim(),badge:$("mAddBadge").value||"none"};
 if(!data.name||!data.price){setMsg("mMsg","اكتب اسم الصنف والسعر",true);return}
 try{
  if(id)await updateDoc(doc(db,"menu",id),{...data,sourceKey:stableKey,deleted:false});
  else{const index=getBaseMenuIndex(),key=stableKey||index.legacy.get(`${data.category.toLowerCase()}||${data.name.toLowerCase()}`)||`manual:${Date.now()}:${Math.random().toString(36).slice(2)}`,base=index.byKey.get(key);await addDoc(collection(db,"menu"),{...data,sourceKey:key,...(base?{originalName:base.originalName}:{})})}
  resetMenuForm();$("menuForm").classList.add("hidden");
  buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);
  setMsg("mMsg","تم حفظ الصنف الجديد ✓")
 }catch(x){setMsg("mMsg",x.code||x.message,true)}
};
$("mImport").onclick=async()=>{try{const s=await getDocs(collection(db,"menu")),index=getBaseMenuIndex(),existing=new Set();s.forEach(d=>{const x=d.data(),k=resolveMenuDoc(x,index);if(k)existing.add(k)});for(const [k,x] of index.byKey){if(existing.has(k))continue;await addDoc(collection(db,"menu"),{...x,sourceKey:k,originalName:x.originalName,categoryId:x.categoryId})}buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);setMsg("mMsg","تم استيراد الأصناف الناقصة فقط ✓")}catch(x){setMsg("mMsg",x.code||x.message,true)}};
</script>
