<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYT Café Admin</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
    header{background:#222;color:#fff;padding:20px;text-align:center}
    main{max-width:1000px;margin:30px auto;padding:20px}
    .card{background:#fff;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccc}
    button{background:#222;color:#fff;border:0;cursor:pointer}
    button:hover{opacity:.9}
    .hidden{display:none}.item{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}
    .logout{background:#b00020}.error{color:#b00020}.success{color:#087f23}
  </style>
</head>
<body>
<header><h1>☕ TYT Café Admin</h1></header>
<main>
  <section id="loginSection" class="card">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <p id="loginMessage"></p>
  </section>

  <section id="adminSection" class="hidden">
    <div class="card">
      <h2>Dashboard</h2>
      <p>Total Menu Items: <strong id="menuCount">0</strong></p>
    </div>

    <div class="card">
      <h2>Add Menu Item</h2>
      <input id="itemName" placeholder="Item name">
      <input id="itemPrice" placeholder="Price">
      <input id="itemCategory" placeholder="Category">
      <button id="addItemBtn">Add Item</button>
      <p id="addMessage"></p>
    </div>

    <div class="card">
      <h2>Menu</h2>
      <div id="menuList">Loading...</div>
    </div>

    <div class="card">
      <button id="logoutBtn" class="logout">Sign out</button>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMLJTHl0d1wA-9LWLfAxxMW7s9qnAdUbK",
    authDomain: "tyt-cafe.firebaseapp.com",
    projectId: "tyt-cafe",
    storageBucket: "tyt-cafe.firebasestorage.app",
    messagingSenderId: "463065862818",
    appId: "1:463065862818:web:b3b5de8fa0913e52ebbdfb",
    measurementId: "G-T6R773TFTB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  const loginSection = $("loginSection"), adminSection = $("adminSection");
  const loginBtn = $("loginBtn"), logoutBtn = $("logoutBtn");
  const loginMessage = $("loginMessage"), menuList = $("menuList"), menuCount = $("menuCount");
  const addMessage = $("addMessage");

  loginBtn.addEventListener("click", async () => {
    loginMessage.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    } catch (error) {
      loginMessage.className = "error";
      loginMessage.textContent = "Login failed: " + (error.code || error.message);
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, user => {
    if (user) {
      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");
      loadMenu();
    } else {
      loginSection.classList.remove("hidden");
      adminSection.classList.add("hidden");
    }
  });

  async function loadMenu() {
    menuList.textContent = "Loading...";
    try {
      const snapshot = await getDocs(collection(db, "menu"));
      menuCount.textContent = snapshot.size;
      menuList.innerHTML = "";
      if (snapshot.empty) {
        menuList.innerHTML = "<p>No menu items yet.</p>";
        return;
      }
      snapshot.forEach(item => {
        const data = item.data();
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <strong>${escapeHtml(data.name || "")}</strong><br>
          Price: ${escapeHtml(String(data.price ?? ""))}<br>
          Category: ${escapeHtml(data.category || "")}<br>
          <button>Delete</button>
        `;
        div.querySelector("button").addEventListener("click", async () => {
          if (!confirm("Delete this item?")) return;
          try {
            await deleteDoc(doc(db, "menu", item.id));
            loadMenu();
          } catch (error) {
            alert("Delete failed: " + (error.code || error.message));
          }
        });
        menuList.appendChild(div);
      });
    } catch (error) {
      menuList.innerHTML = `<p class="error">Error loading menu: ${escapeHtml(error.code || error.message)}</p>`;
    }
  }

  $("addItemBtn").addEventListener("click", async () => {
    const name = $("itemName").value.trim();
    const price = $("itemPrice").value.trim();
    const category = $("itemCategory").value.trim();
    addMessage.textContent = "";
    if (!name || !price || !category) {
      addMessage.className = "error";
      addMessage.textContent = "Please fill all fields.";
      return;
    }
    try {
      await addDoc(collection(db, "menu"), { name, price, category });
      $("itemName").value = "";
      $("itemPrice").value = "";
      $("itemCategory").value = "";
      addMessage.className = "success";
      addMessage.textContent = "Item added successfully.";
      loadMenu();
    } catch (error) {
      addMessage.className = "error";
      addMessage.textContent = "Error: " + (error.code || error.message);
    }
  });

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }
</script>
</body>
</html>
