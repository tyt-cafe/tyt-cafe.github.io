<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYT Café — Admin</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 16px}
.card{background:#1b1b1f;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:18px}
h1,h2{margin-top:0}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#101014;color:#eee;border:1px solid #444;border-radius:8px}
textarea{min-height:80px;resize:vertical}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.primary{background:#ff8a3d;color:#111}.ghost{background:#333;color:#fff}.danger{background:#a52b3d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{color:#aaa;margin-top:10px}.error{color:#ff7777}.success{color:#7ee787}
#app{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button.active{outline:2px solid #ff8a3d}
.item{border:1px solid #333;border-radius:10px;padding:13px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:13px;color:#aaa}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="card">
<h1>☕ TYT Café Admin</h1><p>دخول الأدمن.</p>
<form id="loginForm"><label>الإيميل</label><input id="email" type="email" required>
<label>الباسورد</label><input id="password" type="password" required>
<button class="primary">دخول</button><div id="loginMsg" class="msg"></div></form>
</section>

<section id="app">
<div class="card"><div class="row"><div><h1>☕ TYT Café Admin</h1><div id="who" class="small"></div></div><button id="logout" class="ghost">خروج</button></div></div>

<div class="card">
<h2>المنيو</h2>
<div class="tabs"><button class="primary active" id="menuTab">الأصناف</button><button class="ghost" id="offersTab">العروض</button></div>
<div id="menuPanel">
<form id="menuForm"><input type="hidden" id="menuId"><div class="grid">
<div><label>اسم الصنف *</label><input id="mName" required></div>
<div><label>السعر *</label><input id="mPrice" required></div>
<div><label>القسم *</label><input id="mCategory" placeholder="Coffee" required></div>
<div><label>وصف</label><input id="mDescription"></div>
<div class="full"><label>رابط الصورة (اختياري)</label><input id="mImage" type="url"></div>
</div><div class="actions"><button class="primary">حفظ الصنف</button><button type="button" class="ghost" id="mCancel" hidden>إلغاء</button><button type="button" class="ghost" id="seedMenu">استيراد المنيو الحالية إلى Firebase</button></div><div id="mMsg" class="msg"></div></form>
<div id="menuList"></div>
</div>

<div id="offersPanel" hidden>
<form id="offerForm"><input type="hidden" id="oId"><div class="grid">
<div><label>اسم العرض *</label><input id="oName" required></div>
<div><label>السعر الجديد *</label><input id="oNew" required></div>
<div><label>السعر القديم (اختياري)</label><input id="oOld"></div>
<div><label>الخصم مثل -20%</label><input id="oDiscount"></div>
<div><label>الشارة</label><input id="oBadge" placeholder="SPECIAL OFFER"></div>
<div><label>نوع الشارة</label><select id="oStyle"><option value="special">special</option><option value="limited">limited</option></select></div>
<div class="full"><label>الوصف</label><textarea id="oDesc"></textarea></div>
<div class="full"><label>رابط الصورة (اختياري)</label><input id="oImage" type="url"></div>
</div><div class="actions"><button class="primary">حفظ العرض</button><button type="button" class="ghost" id="oCancel" hidden>إلغاء</button><button type="button" class="ghost" id="seedOffers">استيراد العروض الحالية إلى Firebase</button></div><div id="oMsg" class="msg"></div></form>
<div id="offerList"></div>
</div>
</div>
</section></div>

<script src="js/menu-data.js"></script><script src="js/offers-data.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const config={apiKey:"AIzaSyA_iRaVTZwvi25XabH_PfC8cKK_BeYYRPY",authDomain:"tyt-cafe-8c2ae.firebaseapp.com",projectId:"tyt-cafe-8c2ae",storageBucket:"tyt-cafe-8c2ae.firebasestorage.app",messagingSenderId:"298823761893",appId:"1:298823761893:web:7652134d929a5466c9f90c",measurementId:"G-FPYN8MT74C"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);
const col=(name)=>collection(db,name);
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="جاري الدخول...";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(err){$("loginMsg").className="msg error";$("loginMsg").textContent=err.code||err.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$("login").style.display="none";$("app").style.display="block";$("who").textContent=u.email;loadMenu();loadOffers()}else{$("login").style.display="block";$("app").style.display="none"}});

$("menuTab").onclick=()=>{$("menuPanel").hidden=false;$("offersPanel").hidden=true};
$("offersTab").onclick=()=>{$("menuPanel").hidden=true;$("offersPanel").hidden=false};

async function loadMenu(){const box=$("menuList");box.innerHTML="جاري التحميل...";try{const s=await getDocs(col("menu"));box.innerHTML=s.empty?"<div class='msg'>لا توجد أصناف بعد.</div>":"";s.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="item";el.innerHTML=`<div class="row"><div><b>${esc(x.name||"")}</b><div class="small">${esc(x.category||"")} · ${esc(x.price||"")}</div></div><div><button class="ghost" data-edit>تعديل</button> <button class="danger" data-del>حذف</button></div></div><div class="small">${esc(x.description||"")}</div>`;el.querySelector("[data-edit]").onclick=()=>editMenu(d.id,x);el.querySelector("[data-del]").onclick=async()=>{if(confirm("حذف الصنف؟")){await deleteDoc(doc(db,"menu",d.id));loadMenu()}};box.appendChild(el)})}catch(e){box.innerHTML=`<div class="error">${esc(e.code||e.message)}</div>`}}

$("menuForm").onsubmit=async e=>{e.preventDefault();const id=$("menuId").value,data={name:$("mName").value.trim(),price:$("mPrice").value.trim(),category:$("mCategory").value.trim(),description:$("mDescription").value.trim(),image:$("mImage").value.trim(),updatedAt:serverTimestamp()};try{if(id)await updateDoc(doc(db,"menu",id),data);else await addDoc(col("menu"),{...data,createdAt:serverTimestamp()});$("mMsg").className="msg success";$("mMsg").textContent="تم الحفظ ✓";resetMenu();loadMenu()}catch(e){$("mMsg").className="msg error";$("mMsg").textContent=e.code||e.message}};
function editMenu(id,x){$("menuId").value=id;$("mName").value=x.name||"";$("mPrice").value=x.price||"";$("mCategory").value=x.category||"";$("mDescription").value=x.description||"";$("mImage").value=x.image||"";$("mCancel").hidden=false}
function resetMenu(){$("menuForm").reset();$("menuId").value="";$("mCancel").hidden=true}
$("mCancel").onclick=resetMenu;

$("seedMenu").onclick=async()=>{if(!confirm("استيراد المنيو الحالية إلى Firebase؟ لو فيه بيانات بالفعل، سيتم إضافة نسخة أخرى."))return;try{for(const c of MENU_DATA)for(const i of c.items)await addDoc(col("menu"),{name:i.name,price:i.price,category:c.name,categoryId:c.id,description:i.description||"",note:i.note||"",createdAt:serverTimestamp()});$("mMsg").className="msg success";$("mMsg").textContent="تم استيراد المنيو ✓";loadMenu()}catch(e){$("mMsg").className="msg error";$("mMsg").textContent=e.code||e.message}};

async function loadOffers(){const box=$("offerList");box.innerHTML="جاري التحميل...";try{const s=await getDocs(col("offers"));box.innerHTML=s.empty?"<div class='msg'>لا توجد عروض بعد.</div>":"";s.forEach(d=>{const x=d.data(),el=document.createElement("div");el.className="item";el.innerHTML=`<div class="row"><div><b>${esc(x.name||"")}</b><div class="small">${esc(x.newPrice||"")} EGP ${x.oldPrice?` · القديم ${esc(x.oldPrice)} EGP`:""}</div></div><div><button class="ghost" data-edit>تعديل</button> <button class="danger" data-del>حذف</button></div></div><div class="small">${esc(x.description||"")}</div>`;el.querySelector("[data-edit]").onclick=()=>editOffer(d.id,x);el.querySelector("[data-del]").onclick=async()=>{if(confirm("حذف العرض؟")){await deleteDoc(doc(db,"offers",d.id));loadOffers()}};box.appendChild(el)})}catch(e){box.innerHTML=`<div class="error">${esc(e.code||e.message)}</div>`}}
$("offerForm").onsubmit=async e=>{e.preventDefault();const data={name:$("oName").value.trim(),newPrice:$("oNew").value.trim(),oldPrice:$("oOld").value.trim(),discount:$("oDiscount").value.trim(),badge:$("oBadge").value.trim(),badgeStyle:$("oStyle").value,description:$("oDesc").value.trim(),image:$("oImage").value.trim(),updatedAt:serverTimestamp()};try{const id=$("oId").value;if(id)await updateDoc(doc(db,"offers",id),data);else await addDoc(col("offers"),{...data,createdAt:serverTimestamp()});$("oMsg").className="msg success";$("oMsg").textContent="تم حفظ العرض ✓";resetOffer();loadOffers()}catch(e){$("oMsg").className="msg error";$("oMsg").textContent=e.code||e.message}};
function editOffer(id,x){$("oId").value=id;$("oName").value=x.name||"";$("oNew").value=x.newPrice||"";$("oOld").value=x.oldPrice||"";$("oDiscount").value=x.discount||"";$("oBadge").value=x.badge||"";$("oStyle").value=x.badgeStyle||"special";$("oDesc").value=x.description||"";$("oImage").value=x.image||"";$("oCancel").hidden=false}
function resetOffer(){$("offerForm").reset();$("oId").value="";$("oCancel").hidden=true}
$("oCancel").onclick=resetOffer;
$("seedOffers").onclick=async()=>{if(!confirm("استيراد العروض الحالية إلى Firebase؟"))return;try{for(const x of OFFERS_DATA)await addDoc(col("offers"),{...x,createdAt:serverTimestamp()});$("oMsg").className="msg success";$("oMsg").textContent="تم استيراد العروض ✓";loadOffers()}catch(e){$("oMsg").className="msg error";$("oMsg").textContent=e.code||e.message}};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body></html>
