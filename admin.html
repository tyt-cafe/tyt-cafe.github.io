<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYT Café Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #222;
      color: white;
      border: 0;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .hidden {
      display: none;
    }

    .item {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .logout {
      background: #b00020;
    }
  </style>
</head>

<body>

<header>
  <h1>☕ TYT Café Admin</h1>
</header>

<main>

  <section id="loginSection" class="card">
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Sign in</button>

    <p id="loginMessage"></p>
  </section>


  <section id="adminSection" class="hidden">

    <div class="card">
      <h2>Dashboard</h2>
      <p>Total Menu Items: <strong id="menuCount">0</strong></p>
    </div>


    <div class="card">
      <h2>Add Menu Item</h2>

      <input id="itemName" placeholder="Item name">

      <input id="itemPrice" placeholder="Price">

      <input id="itemCategory" placeholder="Category">

      <button id="addItemBtn">Add Item</button>

      <p id="addMessage"></p>
    </div>


    <div class="card">
      <h2>Menu</h2>

      <div id="menuList">
        Loading...
      </div>
    </div>


    <div class="card">
      <button id="logoutBtn" class="logout">
        Sign out
      </button>
    </div>

  </section>

</main>


<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyCMLJTHl0d1wA-9LWLfAxxMW7s9qnAdUbK",
    authDomain: "tyt-cafe.firebaseapp.com",
    projectId: "tyt-cafe",
    storageBucket: "tyt-cafe.firebasestorage.app",
    messagingSenderId: "463065862818",
    appId: "1:463065862818:web:b3b5de8fa0913e52ebbdfb",
    measurementId: "G-T6R773TFTB"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const loginSection = document.getElementById("loginSection");
  const adminSection = document.getElementById("adminSection");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const email = document.getElementById("email");
  const password = document.getElementById("password");

  const loginMessage = document.getElementById("loginMessage");

  const itemName = document.getElementById("itemName");
  const itemPrice = document.getElementById("itemPrice");
  const itemCategory = document.getElementById("itemCategory");

  const addItemBtn = document.getElementById("addItemBtn");
  const addMessage = document.getElementById("addMessage");

  const menuList = document.getElementById("menuList");
  const menuCount = document.getElementById("menuCount");


  loginBtn.addEventListener("click", async () => {

    try {

      await signInWithEmailAndPassword(
        auth,
        email.value,
        password.value
      );

      loginMessage.textContent = "";

    } catch (error) {

      loginMessage.textContent = "Login failed: " + error.message;

    }

  });


  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  onAuthStateChanged(auth, user => {

    if (user) {

      loginSection.classList.add("hidden");

      adminSection.classList.remove("hidden");

      loadMenu();

    } else {

      loginSection.classList.remove("hidden");

      adminSection.classList.add("hidden");

    }

  });


  async function loadMenu() {

    menuList.innerHTML = "Loading...";

    try {

      const snapshot = await getDocs(
        collection(db, "menu")
      );

      menuList.innerHTML = "";

      menuCount.textContent = snapshot.size;

      if (snapshot.empty) {

        menuList.innerHTML = "<p>No menu items yet.</p>";

        return;

      }

      snapshot.forEach(item => {

        const data = item.data();

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
          <strong>${data.name || ""}</strong><br>
          Price: ${data.price || ""}<br>
          Category: ${data.category || ""}<br><br>

          <button data-id="${item.id}">
            Delete
          </button>
        `;

        div.querySelector("button").addEventListener("click", async () => {

          if (!confirm("Delete this item?")) return;

          await deleteDoc(
            doc(db, "menu", item.id)
          );

          loadMenu();

        });

        menuList.appendChild(div);

      });

    } catch (error) {

      menuList.innerHTML =
        "<p>Error loading menu: " + error.message + "</p>";

    }

  }


  addItemBtn.addEventListener("click", async () => {

    if (!itemName.value || !itemPrice.value || !itemCategory.value) {

      addMessage.textContent =
        "Please fill all fields.";

      return;

    }

    try {

      await addDoc(
        collection(db, "menu"),
        {
          name: itemName.value,
          price: itemPrice.value,
          category: itemCategory.value
        }
      );

      itemName.value = "";
      itemPrice.value = "";
      itemCategory.value = "";

      addMessage.textContent =
        "Item added successfully.";

      loadMenu();

    } catch (error) {

      addMessage.textContent =
        "Error: " + error.message;

    }

  });

</script>

</body>
</html>
