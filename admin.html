<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYT Café Admin</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:28px auto;padding:18px}
.card{background:#1b1b1f;border:1px solid #36363b;border-radius:16px;padding:22px;margin-bottom:18px}
h1,h2,h3{margin-top:0}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button,.actions button,.item button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer}
.tab{background:#333;color:#fff}.tab.active{background:#ff8a3d;color:#111}.primary{background:#ff8a3d;color:#111}.danger{background:#b33245;color:#fff}.green{background:#2d8b4b;color:#fff}.dark{background:#333;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:block;margin-bottom:6px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;background:#101014;color:#fff;border:1px solid #444;border-radius:9px;padding:11px}textarea{min-height:90px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.msg{margin-top:12px;color:#aaa}.ok{color:#7ee787}.err{color:#ff7b7b}
.item{border:1px solid #3a3a40;background:#141417;border-radius:12px;padding:14px;margin:10px 0}.itemtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.meta{font-size:13px;color:#aaa;margin-top:5px}.item-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}
.result{cursor:pointer;transition:border-color .15s}.result:hover{border-color:#ff8a3d}.sub{color:#777;font-size:12px;margin-top:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.itemtop{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card">
<h1>☕ TYT Café Admin</h1><h3>تسجيل الدخول</h3>
<form id="loginForm"><label>الإيميل</label><input id="email" type="email" required>
<label>الباسورد</label><input id="password" type="password" required>
<div class="actions"><button class="primary">دخول</button></div><div id="loginMsg" class="msg"></div></form>
</div></div>

<div id="appView" class="wrap hidden">
<div class="card"><div class="itemtop"><div><h1>☕ TYT Café Admin</h1><div id="user" class="meta"></div></div><button id="logout" class="dark">خروج</button></div></div>
<div class="card">
<div class="tabs"><button id="menuTab" class="tab active">الأصناف</button><button id="offersTab" class="tab">العروض</button></div>

<section id="menuPanel">

<div class="card">
<label>ابحث عن صنف</label>
<input id="mSearch" placeholder="اكتب اسم الصنف… مثال: لاتيه أو Espresso" autocomplete="off">
<div id="mResults"></div>
</div>

<div id="mEditorCard" class="card hidden">
<div class="itemtop">
<div><h3 id="mEditorName" style="margin:0"></h3><div id="mEditorMeta" class="meta"></div></div>
<button type="button" id="mClearSelection" class="dark">✕ إلغاء التحديد</button>
</div>
<div class="grid" style="margin-top:14px">
<div><label>السعر الحالي</label><input id="mCurrentPrice" disabled></div>
<div><label>السعر الجديد</label><input id="mNewPrice" inputmode="decimal"></div>
</div>
<div class="actions">
<button type="button" id="mSavePrice" class="primary">حفظ السعر</button>
<button type="button" id="mDeleteItem" class="danger">🗑️ حذف الصنف</button>
</div>
<div id="mEditorMsg" class="msg"></div>
</div>

<div class="card">
<div class="itemtop">
<h3 style="margin:0">إضافة صنف جديد</h3>
<button type="button" id="mToggleAdd" class="dark">+ صنف جديد</button>
</div>
<form id="menuForm" class="hidden">
<input id="menuId" type="hidden"><input id="menuSourceKey" type="hidden">
<div class="grid" style="margin-top:14px">
<div><label>اسم الصنف</label><input id="mName" required></div><div><label>السعر</label><input id="mPrice" required></div>
<div><label>القسم</label><input id="mCategory" list="mCategoryList" required><datalist id="mCategoryList"></datalist></div><div><label>الوصف</label><input id="mDesc"></div>
<div class="full"><label>الصورة</label><input id="mImage"></div>
</div>
<div class="actions"><button class="primary">حفظ الصنف الجديد</button><button type="button" id="mCancelAdd" class="dark">إلغاء</button></div>
<div id="mMsg" class="msg"></div>
</form>
<div class="sub">تستخدم "صنف جديد" فقط للأصناف غير الموجودة أصلًا في المنيو. لتعديل صنف موجود، استخدم البحث بالأعلى.
<button type="button" id="mImport" class="dark" style="margin-top:8px">استيراد الأصناف الناقصة من المنيو الأصلية</button></div>
</div>

</section>

<section id="offersPanel" class="hidden">
<form id="offerForm"><input id="offerId" type="hidden"><div class="grid">
<div><label>اسم العرض</label><input id="oName" required></div><div><label>السعر الجديد</label><input id="oNewPrice" required></div>
<div><label>السعر القديم</label><input id="oOldPrice"></div><div><label>الخصم</label><input id="oDiscount"></div>
<div><label>الشارة</label><input id="oBadge"></div><div><label>نوع الشارة</label><select id="oBadgeType"><option value="special">special</option><option value="limited">limited</option></select></div>
<div class="full"><label>الوصف</label><textarea id="oDescription"></textarea></div>
<div class="full"><label>رابط الصورة</label><input id="oImage"></div>
<div><label>الحالة</label><select id="oActive"><option value="true">🟢 شغال</option><option value="false">🔴 متوقف</option></select></div>
</div><div class="actions"><button class="primary">حفظ العرض</button><button type="button" id="oNew" class="dark">عرض جديد</button><button type="button" id="oDeleteAll" class="danger">حذف كل العروض</button></div><div id="oMsg" class="msg"></div></form>
<h3>العروض الموجودة</h3><div id="offerList"></div>
</section>
</div></div>

<script src="js/menu-data.js"></script><script src="js/offers-data.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA_iRaVTZwvi25XabH_PfC8cKK_BeYYRPY",authDomain:"tyt-cafe-8c2ae.firebaseapp.com",projectId:"tyt-cafe-8c2ae",storageBucket:"tyt-cafe-8c2ae.firebasestorage.app",messagingSenderId:"298823761893",appId:"1:298823761893:web:7652134d929a5466c9f90c"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const setMsg=(id,t,err=false)=>{$(id).textContent=t;$(id).className="msg "+(err?"err":"ok")};

$("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(x){setMsg("loginMsg","بيانات الدخول غير صحيحة",true)}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("user").textContent=u.email||"";initMenuAdmin();loadOffers()}else{$("loginView").classList.remove("hidden");$("appView").classList.add("hidden")}});

$("menuTab").onclick=()=>{$("menuPanel").classList.remove("hidden");$("offersPanel").classList.add("hidden");$("menuTab").classList.add("active");$("offersTab").classList.remove("active")};
$("offersTab").onclick=()=>{$("offersPanel").classList.remove("hidden");$("menuPanel").classList.add("hidden");$("offersTab").classList.add("active");$("menuTab").classList.remove("active");loadOffers()};

function resetOffer(){$("offerForm").reset();$("offerId").value="";$("oActive").value="true"}
$("oNew").onclick=resetOffer;
$("offerForm").onsubmit=async e=>{e.preventDefault();const id=$("offerId").value;
 const data={name:$("oName").value.trim(),newPrice:$("oNewPrice").value.trim(),oldPrice:$("oOldPrice").value.trim(),discount:$("oDiscount").value.trim(),badge:$("oBadge").value.trim(),badgeType:$("oBadgeType").value,description:$("oDescription").value.trim(),image:$("oImage").value.trim(),active:$("oActive").value==="true"};
 try{if(id)await updateDoc(doc(db,"offers",id),data);else await addDoc(collection(db,"offers"),data);resetOffer();await loadOffers();setMsg("oMsg","تم حفظ العرض ✓")}catch(x){setMsg("oMsg",x.code||x.message,true)}};
async function loadOffers(){const box=$("offerList");box.innerHTML="جاري التحميل...";
 try{const s=await getDocs(collection(db,"offers"));box.innerHTML=s.empty?"<div class='msg'>مفيش عروض حاليًا في Firebase.</div>":"";
 s.forEach(d=>{const x=d.data(),active=x.active!==false,el=document.createElement("div");el.className="item";
 el.innerHTML=`<div class="itemtop"><div><b>${esc(x.name||"بدون اسم")}</b><div class="meta">السعر: ${esc(x.newPrice??"")} · القديم: ${esc(x.oldPrice??"")} · الخصم: ${esc(x.discount??"")} · ${active?"🟢 شغال":"🔴 متوقف"}</div></div><div class="item-actions"><button class="dark edit">✏️ تعديل</button><button class="${active?"dark":"green"} toggle">${active?"🔴 إيقاف":"🟢 تشغيل"}</button><button class="danger del">🗑️ حذف</button></div></div><div class="meta">${esc(x.description||"")}</div>`;
 el.querySelector(".edit").onclick=()=>{ $("offerId").value=d.id;$("oName").value=x.name||"";$("oNewPrice").value=x.newPrice??"";$("oOldPrice").value=x.oldPrice??"";$("oDiscount").value=x.discount??"";$("oBadge").value=x.badge||"";$("oBadgeType").value=x.badgeType||"special";$("oDescription").value=x.description||"";$("oImage").value=x.image||"";$("oActive").value=String(active);window.scrollTo({top:0,behavior:"smooth"})};
 el.querySelector(".toggle").onclick=async()=>{await updateDoc(doc(db,"offers",d.id),{active:!active});loadOffers()};
 el.querySelector(".del").onclick=async()=>{
   if(!confirm("حذف العرض ده فقط؟"))return;
   try{
     await deleteDoc(doc(db,"offers",d.id));
     await loadOffers();
     setMsg("oMsg","تم حذف العرض ✓");
   }catch(x){setMsg("oMsg",x.code||x.message,true)}
 };
 box.appendChild(el)})}catch(x){box.innerHTML=`<div class='err'>${esc(x.code||x.message)}</div>`}}

const menuKeyPart=v=>String(v??"").trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const canonicalMenuKey=(categoryId,name)=>`menu:${categoryId}:${menuKeyPart(name)}`;
function getBaseMenuIndex(){
 const byKey=new Map(),legacy=new Map(),positional=new Map();
 if(typeof MENU_DATA==="undefined")return {byKey,legacy,positional};
 MENU_DATA.forEach(c=>(c.items||[]).forEach((it,i)=>{
  const key=canonicalMenuKey(c.id,it.name);
  const item={...it,category:c.name,categoryId:c.id,sourceKey:key,originalName:it.name,__base:true};
  byKey.set(key,item);
  legacy.set(`${String(c.id).trim().toLowerCase()}||${String(it.name).trim().toLowerCase()}`,key);
  legacy.set(`${String(c.name).trim().toLowerCase()}||${String(it.name).trim().toLowerCase()}`,key);
  positional.set(`menu:${c.id}:${i}`,key);
 }));
 return {byKey,legacy,positional};
}
function resolveMenuDoc(x,index){
 let key=index.positional.get(String(x.sourceKey||""))||"";
 const originalName=String(x.originalName||x.baseName||"").trim();
 if(!key&&originalName)key=index.legacy.get(`${String(x.categoryId||"").trim().toLowerCase()}||${originalName.toLowerCase()}`)||index.legacy.get(`${String(x.category||"").trim().toLowerCase()}||${originalName.toLowerCase()}`)||"";
 if(!key)key=index.legacy.get(`${String(x.categoryId||"").trim().toLowerCase()}||${String(x.name||"").trim().toLowerCase()}`)||index.legacy.get(`${String(x.category||"").trim().toLowerCase()}||${String(x.name||"").trim().toLowerCase()}`)||"";
 return key;
}
function populateCategoryList(){
 const dl=$("mCategoryList");if(!dl||typeof MENU_DATA==="undefined")return;
 const names=[...new Set(MENU_DATA.map(c=>c.name))];
 dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
}
populateCategoryList();

/* ---------------------------------------------------------------------
   MENU ADMIN — search/select/edit-price workflow.
   The full merged menu (base + Firebase overrides + extras) is built
   once into an in-memory cache for searching; it is never rendered as
   a big list. Each save/delete still writes exactly one Firestore
   document, so the existing per-item architecture is unchanged.
--------------------------------------------------------------------- */
let MENU_INDEX_CACHE=[];
let SELECTED_ITEM=null;

async function buildMenuIndex(){
 const s=await getDocs(collection(db,"menu")),index=getBaseMenuIndex(),overrides=new Map(),tombstones=new Set(),extras=[];
 s.forEach(d=>{const x=d.data(),key=resolveMenuDoc(x,index);if(x.deleted===true){if(key)tombstones.add(key);return}if(key&&index.byKey.has(key))overrides.set(key,{d,x});else extras.push({d,x})});
 const rows=[];
 index.byKey.forEach((base,key)=>{
  if(tombstones.has(key))return;
  const hit=overrides.get(key);
  rows.push({
   docId:hit?.d?.id||null,
   name:(hit?hit.x.name:base.name)||base.name,
   category:(hit?hit.x.category:base.category)||base.category,
   price:hit?hit.x.price:base.price,
   description:(hit?hit.x.description:base.description)||"",
   image:(hit?hit.x.image:base.image)||"",
   sourceKey:key,
   isBase:true,
   baseData:base
  });
 });
 extras.forEach(r=>rows.push({
  docId:r.d.id,name:r.x.name,category:r.x.category,price:r.x.price,
  description:r.x.description||"",image:r.x.image||"",
  sourceKey:r.x.sourceKey||"",isBase:false,baseData:null
 }));
 return rows;
}

async function initMenuAdmin(){
 try{MENU_INDEX_CACHE=await buildMenuIndex()}catch(x){console.error("menu index",x)}
}

function renderResults(query){
 const box=$("mResults");
 const q=query.trim().toLowerCase();
 if(!q){box.innerHTML="";return}
 const matches=MENU_INDEX_CACHE.filter(it=>String(it.name||"").toLowerCase().includes(q)).slice(0,12);
 if(!matches.length){box.innerHTML="<div class='msg'>لا يوجد صنف بهذا الاسم.</div>";return}
 box.innerHTML="";
 matches.forEach(it=>{
  const el=document.createElement("div");el.className="item result";
  el.innerHTML=`<div class="itemtop"><div><b>${esc(it.name)}</b><div class="meta">${esc(it.category)} · ${esc(it.price)} EGP</div></div></div>`;
  el.onclick=()=>selectItem(it);
  box.appendChild(el);
 });
}

function selectItem(it){
 SELECTED_ITEM=it;
 $("mEditorName").textContent=it.name;
 $("mEditorMeta").textContent=`${it.category}${it.isBase?" · من المنيو الأصلية":" · مضاف من الإدارة"}`;
 $("mCurrentPrice").value=it.price??"";
 $("mNewPrice").value=it.price??"";
 $("mEditorMsg").textContent="";$("mEditorMsg").className="msg";
 $("mEditorCard").classList.remove("hidden");
 $("mResults").innerHTML="";
 window.scrollTo({top:0,behavior:"smooth"});
}

function clearSelection(){
 SELECTED_ITEM=null;
 $("mEditorCard").classList.add("hidden");
 $("mNewPrice").value="";
}

$("mSearch").addEventListener("input",e=>renderResults(e.target.value));
$("mClearSelection").onclick=clearSelection;

$("mSavePrice").onclick=async()=>{
 if(!SELECTED_ITEM)return;
 const newPrice=$("mNewPrice").value.trim();
 if(!newPrice){setMsg("mEditorMsg","اكتب السعر الجديد",true);return}
 const it=SELECTED_ITEM;
 const payload={
  name:it.name,category:it.category,price:newPrice,
  description:it.description||"",image:it.image||"",
  sourceKey:it.sourceKey,deleted:false,
  ...(it.isBase?{originalName:it.baseData.originalName,categoryId:it.baseData.categoryId}:{})
 };
 try{
  if(it.docId)await updateDoc(doc(db,"menu",it.docId),payload);
  else{const ref=await addDoc(collection(db,"menu"),payload);it.docId=ref.id}
  it.price=newPrice;
  $("mCurrentPrice").value=newPrice;
  setMsg("mEditorMsg","✓ تم حفظ السعر بنجاح");
  buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);
 }catch(x){setMsg("mEditorMsg",x.code||x.message,true)}
};

$("mDeleteItem").onclick=async()=>{
 if(!SELECTED_ITEM)return;
 if(!confirm("حذف الصنف ده فقط؟"))return;
 const it=SELECTED_ITEM;
 try{
  if(it.isBase){
   const payload={deleted:true,sourceKey:it.sourceKey,originalName:it.baseData.originalName,categoryId:it.baseData.categoryId,category:it.baseData.category};
   if(it.docId)await updateDoc(doc(db,"menu",it.docId),payload);
   else await addDoc(collection(db,"menu"),payload);
  }else if(it.docId){
   await deleteDoc(doc(db,"menu",it.docId));
  }
  setMsg("mMsg","تم حذف الصنف ✓");
  clearSelection();
  $("mSearch").value="";$("mResults").innerHTML="";
  buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);
 }catch(x){setMsg("mEditorMsg",x.code||x.message,true)}
};

/* ---------------------------------------------------------------------
   ADD NEW ITEM — separate workflow, only for items that don't already
   exist in the base menu.
--------------------------------------------------------------------- */
function resetMenuForm(){
 $("menuForm").reset();$("menuId").value="";$("menuSourceKey").value="";
}
$("mToggleAdd").onclick=()=>{
 const willShow=$("menuForm").classList.contains("hidden");
 $("menuForm").classList.toggle("hidden");
 if(willShow){resetMenuForm();$("mName").focus()}
};
$("mCancelAdd").onclick=()=>{$("menuForm").classList.add("hidden");resetMenuForm()};

$("menuForm").onsubmit=async e=>{
 e.preventDefault();const id=$("menuId").value,data={name:$("mName").value.trim(),price:$("mPrice").value.trim(),category:$("mCategory").value.trim(),description:$("mDesc").value.trim(),image:$("mImage").value.trim()},stableKey=$("menuSourceKey").value.trim();
 try{
  if(id)await updateDoc(doc(db,"menu",id),{...data,sourceKey:stableKey,deleted:false});
  else{const index=getBaseMenuIndex(),key=stableKey||index.legacy.get(`${data.category.toLowerCase()}||${data.name.toLowerCase()}`)||`manual:${Date.now()}:${Math.random().toString(36).slice(2)}`,base=index.byKey.get(key);await addDoc(collection(db,"menu"),{...data,sourceKey:key,...(base?{originalName:base.originalName,categoryId:base.categoryId}:{})})}
  resetMenuForm();$("menuForm").classList.add("hidden");
  buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);
  setMsg("mMsg","تم حفظ الصنف الجديد ✓")
 }catch(x){setMsg("mMsg",x.code||x.message,true)}
};
$("mImport").onclick=async()=>{try{const s=await getDocs(collection(db,"menu")),index=getBaseMenuIndex(),existing=new Set();s.forEach(d=>{const x=d.data(),k=resolveMenuDoc(x,index);if(k)existing.add(k)});for(const [k,x] of index.byKey){if(existing.has(k))continue;await addDoc(collection(db,"menu"),{...x,sourceKey:k,originalName:x.originalName,categoryId:x.categoryId})}buildMenuIndex().then(rows=>MENU_INDEX_CACHE=rows);setMsg("mMsg","تم استيراد الأصناف الناقصة فقط ✓")}catch(x){setMsg("mMsg",x.code||x.message,true)}};
</script>
</body></html>
